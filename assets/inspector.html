<!doctype html><html><head><meta charset="utf-8"><style>body{background:#25272a;color:#eee;font:12px -apple-system,sans-serif;padding:12px}label{display:block;margin:14px 0 6px;color:#bbb}select,button{box-sizing:border-box;width:100%;padding:8px;background:#363a40;color:white;border:1px solid #62666b;border-radius:5px}p{color:#aaa;line-height:1.5}</style></head><body><strong>Camera Control</strong><label>Camera</label><select id="camera"></select><div id="dial"><label>Setting</label><select id="parameter"><option value="wb">White balance · Kelvin</option><option value="playback">Playback speed / play-pause</option><option value="tint">CC tint</option><option value="shutter">Shutter angle</option><option value="ei">Exposure index</option><option value="nd">ND filter</option><option value="fps">Sensor FPS</option></select></div><div id="key"><label>Button</label><select id="command"><option value="settings">Open camera settings</option><option value="gang">Choose gang cameras</option><option value="playback">Enter playback</option><option value="live">Return to live view</option><option value="previousClip">Previous clip</option><option value="nextClip">Next clip</option></select></div><p>Turn to adjust. Press or tap to reset (playback: play/pause). Values come from camera readback. Gang uses the camera checkboxes in the builder.</p><button id="settings">Open Camera Profile Builder</button><p id="status"></p><script>
let socket,context,action,settings={};
function send(event,payload){if(socket?.readyState===1)socket.send(JSON.stringify({event,context,action,payload}));}
function connectElgatoStreamDeckSocket(port,uuid,event,info,actionInfo){context=uuid;let a=JSON.parse(actionInfo);action=a.action;settings=a.payload.settings||{};document.getElementById('dial').hidden=!action.endsWith('.dial');document.getElementById('key').hidden=action.endsWith('.dial');document.getElementById('parameter').value=settings.parameter||'wb';document.getElementById('command').value=settings.command||'settings';socket=new WebSocket('ws://127.0.0.1:'+port);socket.onopen=()=>{socket.send(JSON.stringify({event,uuid}));send('sendToPlugin',{command:'info'})};socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.event==='sendToPropertyInspector'){let select=document.getElementById('camera');select.replaceChildren();for(let c of [...m.payload.cameras,{id:'gang',name:'GANG · checked cameras',address:''}]){let option=document.createElement('option');option.value=c.id;option.textContent=c.name+(c.address?' · '+c.address:'');select.append(option)}select.value=settings.cameraID||'';document.getElementById('status').textContent=m.payload.gangEnabled?'Gang is ON for all profiles.':'';}};}
for(let id of ['camera','parameter','command'])document.getElementById(id).onchange=()=>{settings.cameraID=document.getElementById('camera').value;settings.parameter=document.getElementById('parameter').value;settings.command=document.getElementById('command').value;send('setSettings',settings)};
document.getElementById('settings').onclick=()=>send('sendToPlugin',{command:'settings'});
</script></body></html>
